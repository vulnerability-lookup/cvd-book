project:
  type: book
  output-dir: _book

lang: en

book:
  title: "Coordinated Vulnerability Disclosure"
  subtitle: "A Practical Guide for CNAs, GNAs, CSIRTs, and Publishers"
  author: "Vulnerability-Lookup contributors"
  editor:
    - literal: "CIRCL Computer Incident Response Center Luxembourg"
  isbn: "978-99987-458-1-0"
  date: today
  favicon: assets/vulnerability-lookup-icon.svg
  site-url: https://vulnerability-lookup.github.io/cvd-book/
  repo-url: https://github.com/vulnerability-lookup/cvd-book
  repo-branch: main
  repo-actions: [edit, issue]
  output-file: cvd-book
  downloads: [pdf]
  search: true
  sidebar:
    logo: assets/vulnerability-lookup-logo.jpg
    logo-alt: "Vulnerability-Lookup"
    style: docked
    collapse-level: 1
  page-footer:
    left: "Coordinated Vulnerability Disclosure"
    right: "Built with [Quarto](https://quarto.org)"
  chapters:
    - index.qmd
    - acknowledgements/index.qmd
    - part: "Getting Started"
      chapters:
        - roles/index.qmd
        - preparing-your-instance/index.qmd
    - part: "Handling a Disclosure"
      chapters:
        - intake-and-triage/index.qmd
        - investigation-and-coordination/index.qmd
    - part: "Publishing and Follow-up"
      chapters:
        - vulnerability-record-quality/index.qmd
        - cna-publication/index.qmd
        - gna-publication/index.qmd
        - advisory-and-follow-up/index.qmd
        - monitor-cvd/index.qmd
        - kev-catalogue/index.qmd
    - part: "Use Cases"
      chapters:
        - multi-party-disclosure/index.qmd
        - patch-to-advisory/index.qmd
  appendices:
    - checklists/index.qmd
    - references/index.qmd
    - training-strategy/index.qmd

filters:
  - cite-this

cite-this:
  position: title
  scope: work
  formats: [html, typst]
  work:
    type: book
    author:
      - literal: Vulnerability-Lookup contributors
  bibtex:
    type: book
    key: cvd-book

format:
  html:
    grid:
      sidebar-width: 260px
      body-width: 850px
      margin-width: 220px
    theme:
      light: [cosmo, assets/book.scss]
      dark: [darkly, assets/book.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    code-block-bg: true
    link-external-newwindow: true
    number-sections: false
  typst:
    papersize: a4
    toc: true
    toc-depth: 1
    number-sections: false
    fontsize: 10.5pt
    mainfont: Source Sans 3
    codefont: Source Code Pro
    font-paths: [assets/pdf/fonts]
    template-partials: [assets/pdf/typst-show.typ]
    filters:
      - path: assets/pdf/chapter-links.lua
        at: post-quarto
